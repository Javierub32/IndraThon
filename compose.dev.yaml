services:
  backend:
    build: ./backend
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app

  frontend:
    environment:
      VITE_API_TARGET: http://backend:8000
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
